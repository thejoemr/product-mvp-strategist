name: Verify package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run validate
      - run: npm pack --dry-run

  npx-install-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install directly from published GitHub repo via npx
        run: |
          mkdir -p "$RUNNER_TEMP/mvp-audit-smoke"
          cd "$RUNNER_TEMP/mvp-audit-smoke"
          npx --yes github:thejoemr/product-mvp-strategist init
          test -f .claude/skills/product-mvp-audit/SKILL.md
          npx --yes github:thejoemr/product-mvp-strategist doctor
      - name: Verify explicit npm exec invocation
        run: |
          mkdir -p "$RUNNER_TEMP/explicit-smoke"
          cd "$RUNNER_TEMP/explicit-smoke"
          npm exec --yes --package=github:thejoemr/product-mvp-strategist -- product-mvp-strategist init
          test -f .claude/agents/product-mvp-strategist.md
