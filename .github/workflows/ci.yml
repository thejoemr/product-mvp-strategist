name: Verify package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run validate
      - run: npm pack --dry-run

  native-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @anthropic-ai/claude-code@2.1.309
      - run: npm run validate:plugin
      - name: Install native plugin with an isolated Claude configuration
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-plugin-smoke
        run: |
          claude plugin install product-mvp-strategist --marketplace "$GITHUB_WORKSPACE" --json
          claude plugin details product-mvp-strategist@product-mvp-tools

  package-install-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the current checkout's package
        run: |
          MVP_TARBALL="$RUNNER_TEMP/$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          mkdir -p "$RUNNER_TEMP/mvp-package-smoke"
          cd "$RUNNER_TEMP/mvp-package-smoke"
          npm exec --yes --package="$MVP_TARBALL" -- product-mvp-strategist init
          test -f .claude/agents/product-mvp-strategist.md
          test -f .claude/skills/product-mvp-audit/SKILL.md
          npm exec --yes --package="$MVP_TARBALL" -- product-mvp-strategist doctor
